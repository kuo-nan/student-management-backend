[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "alembic/*",
    "tests/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".venv.broken"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
